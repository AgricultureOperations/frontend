# Used only by the Docker image (local compose); Netlify serves dist/ without nginx.
# 8080, not 80: nginx runs as the non-root `nginx` user (see Dockerfile), and must match
# the Dockerfile's EXPOSE and the "<host>:8080" mapping in the root docker-compose.yml.
server {
    listen 8080;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
